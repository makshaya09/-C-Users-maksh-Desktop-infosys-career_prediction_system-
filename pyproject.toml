[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careercast"
version = "1.0.0"
description = "AI-Based Career Prediction, Recommendation & Skill Gap Analysis System"
readme = "README.md"
authors = [
    { name = "CareerCast AI Team", email = "info@careercast.ai" }
]
license = { text = "MIT" }
keywords = [
    "career-prediction",
    "recommendation-system",
    "skill-gap-analysis",
    "machine-learning",
    "nlp",
    "resume-parsing",
    "fastapi",
    "streamlit"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "spacy>=3.7.0",
    "joblib>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "PyPDF2>=3.0.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.5.0",
    "mlflow>=2.10.0",
    "streamlit>=1.30.0",
    "httpx>=0.26.0",
    "reportlab>=4.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.0.0"
]

[project.scripts]
careercast = "careercast.cli.main:main"

[tool.setuptools]
packages = ["careercast", "careercast.cli", "careercast.reports", "careercast.analytics", "ml", "nlp", "skill_gap", "api"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.pkl", "*.csv", "*.txt", "*.png", "*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
